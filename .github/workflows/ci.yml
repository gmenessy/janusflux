name: JanusFlux CI & Delivery Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify-and-test:
    name: Architecture, Typecheck, RLS & Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv & Python 3.11
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Run Ruff Linter
        run: uv run --no-sync ruff check src/ tests/ workflows/ scripts/

      - name: Run Mypy Typecheck
        run: uv run --no-sync mypy src/ workflows/

      - name: Run Architecture & Cleartext-Log Gates
        run: |
          uv run --no-sync python scripts/check_architecture.py
          uv run --no-sync python scripts/scan_cleartext_logs.py

      - name: Run Pytest Suite (LWP-01 to LWP-18)
        run: uv run --no-sync pytest tests/ -v --tb=short

      - name: Verify Release Manifest
        run: uv run --no-sync python -m plattform.cli release-check
